[package]
name = "koda-color"
description = "KODA Pro aba Cor: clip colour grades made of nodes (data model, commands, CPU reference and GPU passes)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-color = { workspace = true }
filmcraft-engine = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
filmcraft-frame = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-time = { workspace = true }
pollster = "0.4"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
